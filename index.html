<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zoeiii's little listening room</title>
  <meta name="description" content="给 Zoeiii 的一间小小听歌房">
  <meta name="theme-color" content="#F7F0E6">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐙%3C/text%3E%3C/svg%3E">
  <!-- 字体异步加载：网络打不开 Google Fonts 时会自动退回系统字体，不会卡住页面 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Special+Elite&family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ============ 1. 首屏 ============ -->
  <header class="hero" id="top">
    <div class="hero-deco" aria-hidden="true">
      <span class="deco-record"></span>
      <span class="deco-tape deco-tape--a"></span>
      <span class="deco-tape deco-tape--b"></span>
      <svg class="deco-star deco-star--a" viewBox="0 0 24 24"><path d="M12 2.5l2.4 6.6 7 .3-5.5 4.3 1.9 6.8L12 16.6l-5.8 3.9 1.9-6.8L2.6 9.4l7-.3z"/></svg>
      <svg class="deco-star deco-star--b" viewBox="0 0 24 24"><path d="M12 2.5l2.4 6.6 7 .3-5.5 4.3 1.9 6.8L12 16.6l-5.8 3.9 1.9-6.8L2.6 9.4l7-.3z"/></svg>
    </div>

    <div class="hero-text">
      <h1 class="hero-title">Zoeiii's little <em>listening room</em></h1>
      <p class="hero-lead">Zoeiii 的音乐小窝</p>
      <p class="hero-sub">Lana Del Rey · Piano Version</p>
    </div>

    <div class="hero-octo">
      <button class="octo-btn" type="button" aria-label="戳一下小章鱼">
        <svg class="octo" viewBox="0 0 320 320" role="img" aria-label="一只戴着耳机听歌的粉色小章鱼">
          <defs>
            <path id="t1" d="M108 188 C 92 222, 70 236, 80 258 C 88 274, 108 266, 100 252"/>
            <path id="t2" d="M130 196 C 124 232, 112 256, 124 276 C 134 290, 150 280, 142 268"/>
            <path id="t3" d="M152 200 C 150 240, 146 262, 156 282 C 164 296, 180 288, 172 276"/>
            <path id="t4" d="M170 200 C 174 240, 182 262, 172 282 C 164 296, 148 290, 154 278"/>
            <path id="t5" d="M192 196 C 198 232, 210 256, 198 276 C 188 290, 172 280, 180 268"/>
            <path id="t6" d="M214 188 C 230 222, 252 236, 242 258 C 234 274, 214 266, 222 252"/>
          </defs>

          <!-- 浮起的音符和水泡（播放时才动） -->
          <g class="floaters">
            <circle class="bubble b1" cx="64" cy="230" r="7"/>
            <circle class="bubble b2" cx="262" cy="214" r="5"/>
            <circle class="bubble b3" cx="248" cy="250" r="8"/>
            <text class="note n1" x="40" y="120">♪</text>
            <text class="note n2" x="262" y="96">♫</text>
          </g>

          <g class="octo-body">
            <g class="tentacles">
              <g class="tent tent-1"><use href="#t1" class="t-out"/><use href="#t1" class="t-in"/></g>
              <g class="tent tent-2"><use href="#t2" class="t-out"/><use href="#t2" class="t-in"/></g>
              <g class="tent tent-3"><use href="#t3" class="t-out"/><use href="#t3" class="t-in"/></g>
              <g class="tent tent-4"><use href="#t4" class="t-out"/><use href="#t4" class="t-in"/></g>
              <g class="tent tent-5"><use href="#t5" class="t-out"/><use href="#t5" class="t-in"/></g>
              <g class="tent tent-6"><use href="#t6" class="t-out"/><use href="#t6" class="t-in"/></g>
            </g>

            <ellipse class="head" cx="160" cy="135" rx="88" ry="80"/>
            <ellipse cx="124" cy="92" rx="22" ry="12" fill="#fff" opacity=".35" transform="rotate(-20 124 92)"/>
            <circle class="spot" cx="196" cy="88" r="6"/>
            <circle class="spot" cx="214" cy="104" r="4"/>
            <circle class="spot" cx="182" cy="74" r="3.5"/>

            <!-- 小蝴蝶结 -->
            <g class="bow" transform="translate(112 62) rotate(-18)">
              <path d="M0 0 L-16 -9 L-16 9 Z M0 0 L16 -9 L16 9 Z" fill="#7A3544" stroke="#292522" stroke-width="2.5" stroke-linejoin="round"/>
              <circle r="4.5" fill="#7A3544" stroke="#292522" stroke-width="2.5"/>
            </g>

            <!-- 脸 -->
            <g class="eyes-open">
              <ellipse cx="132" cy="146" rx="9" ry="11" fill="#292522"/>
              <ellipse cx="188" cy="146" rx="9" ry="11" fill="#292522"/>
              <circle cx="135" cy="142" r="3.2" fill="#fff"/>
              <circle cx="191" cy="142" r="3.2" fill="#fff"/>
            </g>
            <g class="eyes-happy" fill="none" stroke="#292522" stroke-width="4" stroke-linecap="round">
              <path d="M122 150 Q132 138 142 150"/>
              <path d="M178 150 Q188 138 198 150"/>
            </g>
            <ellipse class="blush" cx="114" cy="168" rx="13" ry="7"/>
            <ellipse class="blush" cx="206" cy="168" rx="13" ry="7"/>
            <path class="mouth" d="M150 168 Q160 178 170 168" fill="none" stroke="#292522" stroke-width="3.5" stroke-linecap="round"/>

            <!-- 耳机 -->
            <g class="phones">
              <path d="M80 138 C 76 34, 244 34, 240 138" fill="none" stroke="#292522" stroke-width="16" stroke-linecap="round"/>
              <path d="M80 138 C 76 34, 244 34, 240 138" fill="none" stroke="#7A3544" stroke-width="10" stroke-linecap="round"/>
              <rect x="56" y="112" width="38" height="62" rx="16" fill="#7A3544" stroke="#292522" stroke-width="3"/>
              <rect x="226" y="112" width="38" height="62" rx="16" fill="#7A3544" stroke="#292522" stroke-width="3"/>
              <rect x="84" y="120" width="12" height="46" rx="6" fill="#AAB5A0" stroke="#292522" stroke-width="2.5"/>
              <rect x="224" y="120" width="12" height="46" rx="6" fill="#AAB5A0" stroke="#292522" stroke-width="2.5"/>
            </g>
            <!-- 静音时的小标记 -->
            <g class="muted-mark">
              <circle cx="270" cy="104" r="15" fill="#F7F0E6" stroke="#292522" stroke-width="2.5"/>
              <path d="M262 96 L278 112 M278 96 L262 112" stroke="#7A3544" stroke-width="3.5" stroke-linecap="round"/>
            </g>
          </g>
        </svg>
      </button>
      <p class="octo-say" role="status" aria-live="polite"></p>
    </div>

    <div class="hero-cta">
      <button class="btn-primary" type="button" id="start-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="2.5" y="13" width="5" height="8" rx="2"/><rect x="16.5" y="13" width="5" height="8" rx="2"/></svg>
        开始听
      </button>
    </div>
  </header>

  <main>
    <!-- ============ 2. 曲目区 ============ -->
    <section class="playlist" id="playlist" aria-labelledby="playlist-title">
      <div class="section-head">
        <h2 id="playlist-title">Lana playlist</h2>
      </div>
      <ol class="tracks" id="track-list"></ol>
    </section>

    <!-- ============ 5. 结尾 ============ -->
    <section class="ending" aria-label="结尾">
      <div class="end-card">
        <svg class="end-octo" viewBox="0 0 120 120" role="img" aria-label="小章鱼抱着一张唱片">
          <g stroke="#292522" stroke-width="3" stroke-linecap="round">
            <path d="M34 78 C 26 96, 20 100, 26 108" fill="none" stroke="#D9A6A4" stroke-width="9"/>
            <path d="M86 78 C 94 96, 100 100, 94 108" fill="none" stroke="#D9A6A4" stroke-width="9"/>
            <path d="M50 84 C 48 100, 44 106, 50 112" fill="none" stroke="#D9A6A4" stroke-width="9"/>
            <path d="M70 84 C 72 100, 76 106, 70 112" fill="none" stroke="#D9A6A4" stroke-width="9"/>
          </g>
          <ellipse cx="60" cy="52" rx="36" ry="33" fill="#D9A6A4" stroke="#292522" stroke-width="3"/>
          <circle cx="60" cy="86" r="22" fill="#292522"/>
          <circle cx="60" cy="86" r="15" fill="none" stroke="#5a4f4a" stroke-width="1"/>
          <circle cx="60" cy="86" r="7" fill="#7A3544"/>
          <circle cx="60" cy="86" r="1.8" fill="#F7F0E6"/>
          <path d="M30 84 Q 40 74 46 82 M90 84 Q 80 74 74 82" fill="none" stroke="#292522" stroke-width="3" stroke-linecap="round"/>
          <path d="M30 84 Q 40 74 46 82 M90 84 Q 80 74 74 82" fill="none" stroke="#D9A6A4" stroke-width="5" stroke-linecap="round"/>
          <path d="M46 52 Q 51 46 56 52 M64 52 Q 69 46 74 52" fill="none" stroke="#292522" stroke-width="3" stroke-linecap="round"/>
          <ellipse cx="42" cy="61" rx="6" ry="3.5" fill="#C9787A" opacity=".7"/>
          <ellipse cx="78" cy="61" rx="6" ry="3.5" fill="#C9787A" opacity=".7"/>
        </svg>
        <p class="end-text">希望你喜欢这份歌单</p>
      </div>
    </section>
  </main>

  <footer class="site-foot">
    <p>Zoeiii 🐙</p>
  </footer>

  <!-- ============ 播放器面板 ============ -->
  <dialog class="player" id="player" aria-labelledby="player-title">
    <div class="player-card">
      <button class="icon-btn player-close" type="button" id="player-close" aria-label="收起播放器">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <p class="label player-no" id="player-no">No. 01</p>
      <h3 class="player-title" id="player-title">—</h3>
      <p class="player-note" id="player-note"></p>

      <div class="screen">
        <video id="video" playsinline controls preload="metadata"></video>
        <iframe id="embed" title="视频播放器" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" hidden></iframe>
        <div class="screen-msg" id="screen-msg" hidden>
          <span class="screen-disc" aria-hidden="true"></span>
          <p id="screen-msg-text">视频待添加</p>
          <button class="btn-small" type="button" id="retry-btn" hidden>再试一次</button>
        </div>
      </div>

      <div class="player-controls">
        <button class="icon-btn" type="button" data-action="prev" aria-label="上一首">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L9 12l9 6zM6 6v12"/></svg>
        </button>
        <button class="icon-btn icon-btn--main" type="button" data-action="toggle" aria-label="播放">
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5h3v14H8zM13 5h3v14h-3z"/></svg>
        </button>
        <button class="icon-btn" type="button" data-action="next" aria-label="下一首">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l9 6-9 6zM18 6v12"/></svg>
        </button>
      </div>

      <p class="next-hint" id="next-hint" role="status" aria-live="polite" hidden>
        <span id="next-hint-text">下一首也准备好啦</span>
        <button class="btn-small" type="button" data-action="next" id="next-hint-btn">听下一首</button>
      </p>
    </div>
  </dialog>

  <!-- ============ 3. 底部迷你播放器 ============ -->
  <div class="mini" id="mini" role="region" aria-label="迷你播放器" hidden>
    <button class="mini-info" type="button" id="mini-open" aria-label="打开播放器面板">
      <span class="mini-disc" aria-hidden="true"></span>
      <span class="mini-text">
        <span class="mini-no" id="mini-no">No. 01</span>
        <span class="mini-title" id="mini-title">—</span>
      </span>
    </button>
    <div class="mini-progress">
      <span class="time" id="mini-cur">0:00</span>
      <input type="range" id="mini-seek" min="0" max="100" step="0.1" value="0" aria-label="播放进度">
      <span class="time" id="mini-dur">--:--</span>
    </div>
    <div class="mini-controls">
      <button class="icon-btn" type="button" data-action="prev" aria-label="上一首">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L9 12l9 6zM6 6v12"/></svg>
      </button>
      <button class="icon-btn icon-btn--main" type="button" data-action="toggle" aria-label="播放">
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5h3v14H8zM13 5h3v14h-3z"/></svg>
      </button>
      <button class="icon-btn" type="button" data-action="next" aria-label="下一首">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l9 6-9 6zM18 6v12"/></svg>
      </button>
      <button class="icon-btn" type="button" data-action="mute" aria-label="静音" aria-pressed="false">
        <svg class="i-vol" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM16.5 8.5a5 5 0 0 1 0 7"/></svg>
        <svg class="i-mute" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM16 9l5 6M21 9l-5 6"/></svg>
      </button>
    </div>
  </div>

  <div class="sticker-layer" id="sticker-layer" aria-hidden="true"></div>

  <script src="js/tracks.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
